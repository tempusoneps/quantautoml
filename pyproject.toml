[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantautoml"
version = "1.0"
description = "Quantitative AutoML Trading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "dcor>=0.7",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "onnxmltools>=1.16.0",
    "skl2onnx>=1.20.0",
    "autofcholv",
    "labelohlcv",
]

[project.scripts]
quantautoml = "quantautoml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "tempusonebt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantautoml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
autofcholv = { git = "https://github.com/tempusoneps/autofcholv.git", branch = "develop" }
labelohlcv = { git = "https://github.com/tempusoneps/labelohlcv.git", branch = "develop" }
tempusonebt = { git = "https://github.com/tempusoneps/tempusonebt.git" }
